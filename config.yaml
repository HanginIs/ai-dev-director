# AI DEV DIRECTOR configuration
# Strict NO PAY-PER-USE API policy: every agent runs through an official, signed-in CLI session
# (Claude Code / OpenAI Codex / Google Antigravity). API keys in the environment are stripped before any CLI call.

head:
  provider: claude        # HEAD plans and directs corrections; the Reviewer judges independently.
  # The model is whatever the CLI account's default model is; model flags are not passed through.
  executable: null        # Discovered automatically (PATH or the standard install folder)

builder:
  mode: proposal          # Builder returns whole files as JSON; the Director validates and writes them.
  provider: antigravity   # Primary BUILDER: Google Antigravity CLI (failover: codex / claude)
  model: antigravity-cli
  executable: null        # Discovered automatically via resolve_cli('agy')

reviewer:
  provider: codex         # Primary REVIEWER: OpenAI Codex CLI (failover: claude)
  model: codex-cli
  executable: null        # Discovered automatically via resolve_cli('codex')

timeouts:
  head: 300
  builder: 600
  reviewer: 300
  no_progress: 180
  heartbeat: 30

safety:
  max_files_changed: 15
  max_diff_lines: 1500     # Complete greenfield modules commonly exceed 800; path/file caps still apply.
  approved_commands:
    - python
    - pytest
    - npm
    - cargo
    - go
    - make

verification:
  build_command: null
  # Default only. Without a per-project command the Director detects what the project supports: pytest for a
  # Python tests/ folder (ignoring an unrelated parent pytest.ini), `swift test` for a SwiftPM package with test
  # targets, `npm test` for a package.json test script.
  test_command: "python -m pytest tests/"
  lint_command: null
  timeout: 120             # seconds per verification command

bootstrap:
  enabled: true

# Claude Code is started read-only for HEAD, the Reviewer, the proposal Builder and research (the Director writes
# the files and runs the tests itself). See core/claude_cli.py for what each argument does. Needs Claude Code
# 2.1.259 or later; uncomment and change for another version ([] removes the restriction).
# claude_cli:
#   read_only_args: ["--tools", "Read,Grep,Glob", "--disallowedTools", "mcp__*", "--permission-prompts", "none", "--setting-sources", "user"]

# The project's own record of past decisions: the start of its change log (newest first) is shown to HEAD when it
# plans a mission step and to the Reviewer, so a plan does not quietly reverse something the project decided on
# purpose. The first of these files found in the project is used (root first, then one sub-folder).
# max_chars: 0 turns it off.
project_history:
  files: ["CHANGELOG.md", "docs/CHANGELOG.md", "CHANGES.md", "HISTORY.md", "RELEASE_NOTES.md", "DECISIONS.md", "docs/DECISIONS.md"]
  max_chars: 4000

# Per-project verification (kept here, never inside the project, so a Builder cannot weaken it).
# Machine-specific entries belong in the git-ignored config.local.yaml next to this file (same structure,
# deep-merged over this one). Keys are absolute project roots. Example:
# projects:
#   "D:/work/my_service":
#     verification:
#       build_command: ["npm", "run", "build"]
#       test_command: "python -m pytest -q"
projects: {}

autonomy:
  enabled: true
  max_repairs: 3
  # HEAD proxy: HEAD decides on the operator's behalf. Only money (payments, paid services, live-account orders),
  # real credentials/accounts and irreversible external actions stop for a human decision.
  head_proxy: true
  builder_attempts: 3          # retry with feedback; the last attempt moves to another provider
  max_steps: 6                 # milestones per mission
  max_consecutive_failures: 3
  resume_on_start: true        # a companion restart continues interrupted (RUNNING) missions; STOPPED ones stay stopped
  # A finished mission is applied to the project on its own:
  # off | on_done (only when HEAD declared the goal done) | on_pass (any PASSED deliverable).
  # Apply never overwrites a file the operator changed meanwhile (conflict -> blocked, worktree kept) and never deletes.
  auto_apply: on_pass
  profiles:                    # budgets per request size; gates and Scope Guard are the same in every profile
    quick:    {max_steps: 2, max_repairs: 1, builder_attempts: 2}
    standard: {max_steps: 6, max_repairs: 3, builder_attempts: 3}
    deep:     {max_steps: 12, max_repairs: 3, builder_attempts: 3}

# Optional external commissioner (a separate "CEO" service that posts goal-level missions to /ops/solomon).
# Only git projects under allowed_roots may be targeted; the Director's own folder is never a target.
# `director.py do` starts its mission through the same endpoint, so it needs this list as well: put the parent
# folder of your projects in config.local.yaml (the value below is the original's Windows default).
solomon:
  allowed_roots:
    - "D:/work"
  denied:
    - "D:/work/ai-dev-director"
